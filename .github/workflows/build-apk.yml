name: Build Uyir APK

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Your website address, without https:// (for example uyir-abc.vercel.app)"
        required: false
      version_code:
        description: "Version code (whole number, increase it for every Play Store upload)"
        required: false
        default: "1"
      version_name:
        description: "Version name shown to users"
        required: false
        default: "1.0.0"
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/build-apk.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Choose website address
        run: |
          HOST="${{ github.event.inputs.host }}"
          if [ -z "$HOST" ]; then HOST="${{ vars.TWA_HOST }}"; fi
          if [ -z "$HOST" ]; then HOST=$(grep '^twaHost=' gradle.properties | cut -d= -f2); fi
          HOST=$(echo "$HOST" | sed -E 's#^https?://##; s#/+$##')
          echo "TWA_HOST=$HOST" >> $GITHUB_ENV
          echo "App will open: https://$HOST/"

      - name: Load signing key (if added as secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/uyir.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/uyir.jks" >> $GITHUB_ENV
            echo "Signing with your release key."
          else
            echo "No signing key secrets found: building a TEST (debug) APK."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VC="${{ github.event.inputs.version_code }}"; VC=${VC:-1}
          VN="${{ github.event.inputs.version_name }}"; VN=${VN:-1.0.0}
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease bundleRelease -PtwaHost="$TWA_HOST" -PversionCode="$VC" -PversionName="$VN"
          else
            gradle --no-daemon assembleDebug -PtwaHost="$TWA_HOST" -PversionCode="$VC" -PversionName="$VN"
          fi

      - name: SHA-256 fingerprint for assetlinks.json
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            FP=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -m1 'SHA256:' | awk '{print $2}')
          else
            FP=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          fi
          echo "SHA256 fingerprint: $FP"
          mkdir -p out
          cat > out/assetlinks.json <<JSON
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.entraiot.uyir",
                "sha256_cert_fingerprints": ["$FP"]
              }
            }
          ]
          JSON
          echo "### Put this file in web/.well-known/assetlinks.json and redeploy" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat out/assetlinks.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Collect files
        run: |
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          find app/build/outputs -name "*.aab" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: uyir-android
          path: android/out/
